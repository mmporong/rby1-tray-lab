<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RB-Y1 Tray Lab</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #14233b;
      --muted: #627089;
      --line: #dce3ed;
      --paper: #ffffff;
      --wash: #f3f6fa;
      --blue: #175cd3;
      --blue-dark: #0e3f98;
      --green: #147d64;
      --amber: #b15f00;
      --danger: #b42318;
      font-family: Inter, Pretendard, "Noto Sans KR", system-ui, -apple-system, sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--wash); color: var(--ink); min-width: 280px; }
    button { font: inherit; }
    button:focus-visible { outline: 3px solid #84adff; outline-offset: 2px; }
    .shell { max-width: 1500px; margin: 0 auto; padding: 20px; }
    header { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; margin-bottom: 16px; }
    .eyebrow { margin: 0 0 4px; color: var(--blue); font-size: .72rem; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(1.55rem, 3vw, 2.2rem); letter-spacing: -.04em; }
    .subtitle { margin: 7px 0 0; color: var(--muted); font-size: .92rem; }
    .badges { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 7px; }
    .badge { border: 1px solid var(--line); border-radius: 999px; background: var(--paper); color: #34445e; padding: 6px 10px; font-size: .75rem; font-weight: 700; }
    .layout { display: grid; grid-template-columns: minmax(0, 1.8fr) minmax(300px, .72fr); gap: 16px; align-items: start; }
    .panel { border: 1px solid var(--line); border-radius: 14px; background: var(--paper); box-shadow: 0 8px 26px rgba(20, 35, 59, .06); overflow: hidden; }
    .stage { position: relative; aspect-ratio: 4 / 3; background: #e8edf4; }
    .stage img { width: 100%; height: 100%; display: block; object-fit: contain; }
    .stage-status { position: absolute; inset: 14px auto auto 14px; display: flex; align-items: center; gap: 8px; border-radius: 999px; background: rgba(255,255,255,.92); padding: 7px 11px; color: #3c4b62; font-size: .78rem; font-weight: 750; box-shadow: 0 3px 12px rgba(20,35,59,.12); }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #7b879a; }
    .dot.playing, .dot.finished { background: var(--green); box-shadow: 0 0 0 4px rgba(20,125,100,.14); }
    .dot.failed { background: var(--danger); box-shadow: 0 0 0 4px rgba(180,35,24,.14); }
    .error { position: absolute; inset: auto 14px 14px; margin: 0; border-radius: 8px; background: #fff1f0; color: var(--danger); padding: 10px 12px; font-size: .82rem; }
    .hidden { display: none; }
    .toolbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; border-top: 1px solid var(--line); padding: 12px 14px; }
    .button-group { display: flex; flex-wrap: wrap; gap: 8px; }
    button { min-height: 42px; border: 1px solid #c9d3e2; border-radius: 9px; background: var(--paper); color: #293a55; padding: 8px 13px; font-weight: 750; cursor: pointer; }
    button:hover { background: #f7f9fc; border-color: #9aabc3; }
    button.primary { border-color: var(--blue); background: var(--blue); color: white; }
    button.primary:hover { background: var(--blue-dark); }
    button[aria-pressed="true"] { border-color: var(--green); color: var(--green); background: #edf9f5; }
    button:disabled { cursor: wait; opacity: .55; }
    .camera-readout { min-width: 128px; color: var(--muted); font-size: .78rem; text-align: right; }
    aside { display: grid; gap: 16px; }
    .section { padding: 16px; }
    .section h2 { margin: 0 0 12px; font-size: .92rem; letter-spacing: -.01em; }
    .metrics { display: grid; grid-template-columns: 1fr 1fr; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
    .metric { min-width: 0; padding: 12px; border-bottom: 1px solid var(--line); }
    .metric:nth-child(odd) { border-right: 1px solid var(--line); }
    .metric:nth-last-child(-n+2) { border-bottom: 0; }
    .metric dt { margin: 0 0 5px; color: var(--muted); font-size: .72rem; font-weight: 700; }
    .metric dd { margin: 0; overflow-wrap: anywhere; font-size: .97rem; font-weight: 800; font-variant-numeric: tabular-nums; }
    .metric dd.good { color: var(--green); }
    .metric dd.warn { color: var(--amber); }
    pre { max-height: 330px; margin: 0; overflow: auto; border-radius: 9px; background: #111b2c; color: #dce8fa; padding: 13px; font: 12px/1.55 ui-monospace, SFMono-Regular, Consolas, monospace; white-space: pre-wrap; overflow-wrap: anywhere; }
    .help { margin: 10px 0 0; color: var(--muted); font-size: .76rem; line-height: 1.5; }
    @media (max-width: 920px) {
      header { align-items: flex-start; flex-direction: column; }
      .badges { justify-content: flex-start; }
      .layout { grid-template-columns: 1fr; }
      aside { grid-template-columns: 1fr 1fr; }
    }
    @media (max-width: 620px) {
      .shell { padding: 12px; }
      aside { grid-template-columns: 1fr; }
      .stage { aspect-ratio: 1 / 1; }
      .toolbar { align-items: stretch; }
      .button-group { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); flex: 1 1 100%; }
      button { min-height: 44px; padding-inline: 9px; }
      .camera-readout { text-align: left; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; } }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <div>
        <p class="eyebrow">MuJoCo experiment viewer</p>
        <h1>RB-Y1 Tray Lab</h1>
        <p class="subtitle">트레이 운반 실험의 물리 상태를 한 프레임씩 확인합니다.</p>
      </div>
      <div class="badges" aria-label="실험 조건">
        <span id="backendBadge" class="badge">CPU MuJoCo</span>
        <span id="baseBadge" class="badge">베이스 지그 고정 · 안정성 미평가</span>
        <span class="badge">자유 강체 적재물</span>
        <span id="modelBadge" class="badge">모델 차원 로드 중</span>
      </div>
    </header>

    <div class="layout">
      <section class="panel" aria-label="MuJoCo 렌더 화면">
        <div class="stage">
          <img id="frame" alt="RB-Y1 트레이 운반 MuJoCo 시뮬레이션 프레임" width="960" height="720">
          <div class="stage-status" aria-live="polite"><span id="statusDot" class="dot"></span><span id="runStatus">일시정지</span></div>
          <p id="error" class="error hidden" role="alert"></p>
        </div>
        <div class="toolbar">
          <div class="button-group" aria-label="시뮬레이션 제어">
            <button id="play" class="primary" type="button" aria-pressed="false">재생</button>
            <button id="single" type="button">50 스텝</button>
            <button id="reset" type="button">초기화</button>
            <button id="download" type="button">상태 JSON 저장</button>
          </div>
          <div class="button-group" aria-label="카메라 제어">
            <button id="cameraLeft" type="button" aria-label="카메라를 왼쪽으로 15도 회전">시점 왼쪽</button>
            <button id="cameraRight" type="button" aria-label="카메라를 오른쪽으로 15도 회전">시점 오른쪽</button>
          </div>
          <output id="cameraReadout" class="camera-readout">방위 135° · 고도 −20°</output>
        </div>
      </section>

      <aside aria-label="실험 상태">
        <section class="panel section">
          <h2>핵심 상태</h2>
          <dl class="metrics">
            <div class="metric"><dt>단계</dt><dd id="phase">—</dd></div>
            <div class="metric"><dt>시뮬레이션 시간</dt><dd id="simTime">—</dd></div>
            <div class="metric"><dt>트레이 높이</dt><dd id="trayHeight">—</dd></div>
            <div class="metric"><dt>접촉</dt><dd id="contact">—</dd></div>
            <div class="metric"><dt>적재물</dt><dd id="payload">—</dd></div>
            <div class="metric"><dt>독립 판정</dt><dd id="result">진행 전</dd></div>
          </dl>
          <p class="help">표시값은 현재 세션의 상태 응답에서 읽습니다. 실행 성공을 미리 판정하지 않습니다.</p>
        </section>
        <section class="panel section">
          <h2>원본 상태</h2>
          <pre id="rawState" aria-live="polite">상태를 불러오는 중…</pre>
        </section>
      </aside>
    </div>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);
    const ui = {
      frame: $('frame'), play: $('play'), single: $('single'), reset: $('reset'), download: $('download'),
      left: $('cameraLeft'), right: $('cameraRight'), error: $('error'),
      statusDot: $('statusDot'), runStatus: $('runStatus'), camera: $('cameraReadout'),
      raw: $('rawState'), phase: $('phase'), simTime: $('simTime'), trayHeight: $('trayHeight'),
      contact: $('contact'), payload: $('payload'), result: $('result'),
      backendBadge: $('backendBadge'), baseBadge: $('baseBadge'), modelBadge: $('modelBadge')
    };
    let playing = false;
    let busy = false;
    let timer = null;
    let azimuth = 135;
    const elevation = -20;
    let currentState = null;

    const paths = {
      phase: ['phase', 'controller_phase', 'controller.phase', 'task.phase'],
      simTime: ['time_s', 'sim_time', 'time', 'simulation.time'],
      trayHeight: ['tray_height_m', 'tray_height', 'tray.height', 'tray.pos_m.2', 'metrics.tray_height'],
      contact: ['contact', 'contacts', 'grasp.contact', 'metrics.contact'],
      payload: ['payload', 'payloads', 'payload_status', 'metrics.payload'],
      result: ['result']
    };

    function getPath(object, path) {
      return path.split('.').reduce((value, key) => value && typeof value === 'object' ? value[key] : undefined, object);
    }
    function pick(object, candidates) {
      for (const candidate of candidates) {
        const value = getPath(object, candidate);
        if (value !== undefined && value !== null) return value;
      }
      return null;
    }
    function format(value, unit = '') {
      if (value === null) return '—';
      if (typeof value === 'number') return `${new Intl.NumberFormat('ko-KR', { maximumFractionDigits: 3 }).format(value)}${unit}`;
      if (typeof value === 'boolean') return value ? '확인' : '없음';
      if (typeof value === 'string') return value;
      if (Array.isArray(value)) return `${value.length}개`;
      return JSON.stringify(value);
    }
    function formatContact(value) {
      if (value && typeof value === 'object' && !Array.isArray(value)) {
        const fingers = [...(value.left_fingers || []), ...(value.right_fingers || [])];
        if (fingers.length) {
          const held = fingers.filter(Boolean).length;
          const forbidden = Array.isArray(value.forbidden) ? value.forbidden.length : 0;
          return `손잡이 ${held}/${fingers.length} · 금지 ${forbidden}`;
        }
      }
      return format(value);
    }
    function formatResult(result, finished) {
      if (result?.success) return '성공';
      if (result?.failure_reason) return `실패 · ${result.failure_reason}`;
      return finished ? '종료 · 성공 조건 미충족' : '진행 중';
    }
    function updateRunStatus(state) {
      const failed = Boolean(state.result?.failure_reason);
      const succeeded = Boolean(state.result?.success);
      ui.statusDot.classList.toggle('failed', failed);
      ui.statusDot.classList.toggle('finished', !failed && (succeeded || state.finished));
      if (failed) ui.runStatus.textContent = `실패 · ${state.result.failure_reason}`;
      else if (succeeded) ui.runStatus.textContent = '성공 판정';
      else if (state.finished) ui.runStatus.textContent = '실행 종료';
      else ui.runStatus.textContent = playing ? '재생 중' : '일시정지';
      if (state.finished || state.result?.terminal) setPlaying(false, false);
    }
    function updateState(state) {
      currentState = state;
      const simTime = pick(state, paths.simTime);
      ui.phase.textContent = format(pick(state, paths.phase));
      ui.simTime.textContent = format(simTime, typeof simTime === 'number' ? ' s' : '');
      const trayHeight = pick(state, paths.trayHeight);
      ui.trayHeight.textContent = format(trayHeight, typeof trayHeight === 'number' ? ' m' : '');
      ui.contact.textContent = formatContact(pick(state, paths.contact));
      ui.payload.textContent = format(pick(state, paths.payload));
      ui.result.textContent = formatResult(pick(state, paths.result), state.finished);
      ui.result.className = state.result?.success ? 'good' : state.result?.failure_reason ? 'warn' : '';
      ui.backendBadge.textContent = state.backend || 'CPU MuJoCo';
      ui.baseBadge.textContent = state.base_mode === 'fixture' ? '베이스 지그 고정 · 안정성 미평가' : format(state.base_mode);
      const dimensions = state.audit && ['nq', 'nv', 'nu'].every((key) => Number.isInteger(state.audit[key]));
      ui.modelBadge.textContent = dimensions ? `nq ${state.audit.nq} · nv ${state.audit.nv} · nu ${state.audit.nu}` : '모델 차원 미제공';
      ui.raw.textContent = JSON.stringify(state, null, 2);
      updateRunStatus(state);
    }
    function showError(message = '') {
      ui.error.textContent = message;
      ui.error.classList.toggle('hidden', !message);
    }
    async function request(url, options = {}) {
      const response = await fetch(url, { cache: 'no-store', ...options });
      let data;
      try { data = await response.json(); } catch (_) { data = null; }
      if (!response.ok) throw new Error(data?.error || `요청 실패 (${response.status})`);
      return data;
    }
    function refreshFrame() {
      ui.frame.src = `/frame.png?azimuth=${azimuth}&elevation=${elevation}&v=${Date.now()}`;
      ui.camera.value = `방위 ${azimuth}° · 고도 −20°`;
      ui.camera.textContent = ui.camera.value;
    }
    async function refreshState() { updateState(await request('/api/state')); }
    async function advance(steps = 50) {
      if (busy) return;
      busy = true;
      ui.single.disabled = true;
      try {
        const state = await request('/api/step', {
          method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ steps })
        });
        updateState(state);
        refreshFrame();
        showError();
      } catch (error) {
        setPlaying(false);
        showError(`${error.message} 상태를 확인한 뒤 다시 실행해 주세요.`);
      } finally {
        busy = false;
        ui.single.disabled = false;
      }
    }
    function setPlaying(next, updateLabel = true) {
      playing = next;
      ui.play.textContent = playing ? '일시정지' : '재생';
      ui.play.setAttribute('aria-pressed', String(playing));
      ui.statusDot.classList.toggle('playing', playing);
      if (updateLabel) ui.runStatus.textContent = playing ? '재생 중' : '일시정지';
      if (timer) clearInterval(timer);
      timer = playing ? setInterval(() => advance(50), 100) : null;
    }

    ui.play.addEventListener('click', () => setPlaying(!playing));
    ui.single.addEventListener('click', () => advance(50));
    ui.reset.addEventListener('click', async () => {
      setPlaying(false);
      if (busy) return;
      busy = true;
      try {
        updateState(await request('/api/reset', { method: 'POST' }));
        refreshFrame();
        showError();
      } catch (error) { showError(`${error.message} 초기화하지 못했습니다.`); }
      finally { busy = false; }
    });
    ui.download.addEventListener('click', () => {
      if (!currentState) return;
      const blob = new Blob([`${JSON.stringify(currentState, null, 2)}\n`], { type: 'application/json' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = `rby1-tray-state-${Number(currentState.time_s || 0).toFixed(3)}s.json`;
      link.click();
      URL.revokeObjectURL(link.href);
    });
    ui.left.addEventListener('click', () => { azimuth -= 15; refreshFrame(); });
    ui.right.addEventListener('click', () => { azimuth += 15; refreshFrame(); });
    ui.frame.addEventListener('error', () => showError('렌더 프레임을 불러오지 못했습니다. 서버 로그를 확인해 주세요.'));
    ui.frame.addEventListener('load', () => showError());
    document.addEventListener('visibilitychange', () => { if (document.hidden) setPlaying(false); });

    Promise.all([refreshState(), Promise.resolve(refreshFrame())]).catch((error) => showError(`${error.message} 서버 연결을 확인해 주세요.`));
  </script>
</body>
</html>
