[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rby1-tray-lab"
version = "0.1.0"
description = "Reproducible RB-Y1 loaded-tray physics experiments in MuJoCo"
requires-python = ">=3.11"
dependencies = ["mujoco==3.11.0", "numpy>=2.0", "scipy>=1.14", "Pillow>=10"]

[project.scripts]
rby1-tray = "rby1_tray.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rby1_tray = ["web/*.html", "web/*.js"]
